AWSTemplateFormatVersion: '2010-09-09'
Description: Template anidado para la Red (VPC y Subred).

Resources:
  MiVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: vpc-diplomado

  MiSubred:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MiVPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: subnet-publica

Outputs:
  SubnetId:
    Description: ID de la subred creada para los servidores
    Value: !Ref MiSubred