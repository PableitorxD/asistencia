AWSTemplateFormatVersion: '2010-09-09'
Description: Plantilla principal (Parent) que coordina los templates anidados.

Resources:
  VpcStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://pablo-asistencia-templates-bucket.s3.us-east-2.amazonaws.com/templates/vpc.yaml

  ComputeStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: VpcStack
    Properties:
      TemplateURL: https://pablo-asistencia-templates-bucket.s3.us-east-2.amazonaws.com/templates/compute.yaml
      Parameters:
        SubnetIdParam: !GetAtt VpcStack.Outputs.SubnetId
        # Forzar actualización de despliegue